server:
  port: 8081

spring:
  application:
    name: userService
  datasource:
    url: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import: optional:file:.env[.properties]

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
